services:
  mysql:
    image: mysql:8.4
    container_name: omino-sso-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: omino_dev_pwd
      MYSQL_DATABASE: omino_sso
    ports:
      # 默认 3307，避免与本机已有 MySQL 冲突
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - omino-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pomino_dev_pwd"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: omino-sso-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - omino-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  sso:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omino-sso
    environment:
      APP_ENV: ${APP_ENV:-dev}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080}
      # 未登录 SSO 的落点；本地默认留空 = 回落内置登录页（填 http://localhost:5173/login 可验证跳门户）
      PORTAL_LOGIN_URL: ${PORTAL_LOGIN_URL:-}
      # 容器内固定使用随镜像发布的模板路径（Dockerfile 已 COPY）
      OIDC_SIGNING_KEY_PATH: /app/configs/dev-signing-key.pem
      OIDC_SIGNING_KEY_ID: ${OIDC_SIGNING_KEY_ID:-2026-10}
      OIDC_CRYPTO_KEY: ${OIDC_CRYPTO_KEY:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-omino_dev_pwd}
      DB_NAME: ${DB_NAME:-omino_sso}
      REDIS_ADDR: redis:6379
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-mock}
      # 前端 nginx 也是反代的一跳：本地信任 docker 私网网段，审计里才会是真实客户端 IP
      # （生产按实际 LB / 容器网段填写，见 deploy/env/*.env.example）
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # 初始化管理员：仅在 users 表为空时创建；留空 = 不创建（避免无意中重置口令）
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # 便于本地复现「探针不被限流」：RATE_LIMIT_API_PER_MIN=1 docker compose up -d sso
      RATE_LIMIT_API_PER_MIN: ${RATE_LIMIT_API_PER_MIN:-300}
    ports:
      - "127.0.0.1:${SSO_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${ADMIN_HOST_PORT:-8081}:8081"
    volumes:
      - ./configs/dev-signing-key.pem:/app/configs/dev-signing-key.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 探针不被限流（middleware 对 /healthz 短路），故可作为编排级存活判定
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # 前端：与线上同构（nginx 静态托管 + 同源 /api/ 反代），差异只有 API_UPSTREAM 的取值。
  # 命名提示：ADMIN_HOST_PORT 是后端管理 API（8081），ADMIN_UI_HOST_PORT 才是后台页面（8090）。
  portal:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: portal
      args:
        VITE_ADMIN_HOME: http://localhost:${ADMIN_UI_HOST_PORT:-8090}/
        VITE_SSO_BASE_URL: http://localhost:${SSO_HOST_PORT:-8080}
        VITE_PORTAL_HOME: http://localhost:${PORTAL_HOST_PORT:-8088}/account/profile
        VITE_PORTAL_LOGIN_URL: http://localhost:${PORTAL_HOST_PORT:-8088}/login
        VITE_SITE_NAME: ${VITE_SITE_NAME:-统一身份认证}
    container_name: omino-sso-portal
    environment:
      # 一体化：直连同一编排里的 sso 管理 API（线上换内网 api 域）
      API_UPSTREAM: http://sso:8081
    ports:
      - "${PORTAL_HOST_PORT:-8088}:80"
    depends_on:
      # nginx 启动期解析 upstream：sso 未就绪会让前端容器直接退出并进入重启循环
      sso:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  admin:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: admin
      args:
        VITE_PORTAL_HOME: http://localhost:${PORTAL_HOST_PORT:-8088}/account/profile
        VITE_PORTAL_LOGIN_URL: http://localhost:${PORTAL_HOST_PORT:-8088}/login
        VITE_SITE_NAME: ${VITE_SITE_NAME:-统一身份认证}
    container_name: omino-sso-admin
    environment:
      API_UPSTREAM: http://sso:8081
    ports:
      - "${ADMIN_UI_HOST_PORT:-8090}:80"
    depends_on:
      sso:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  omino-mysql-data:
  omino-redis-data:
