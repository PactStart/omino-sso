# spec-gates CI boundary — projected by /speckit.gates.ci github, adapted for this Go repo.
# Runs the IDENTICAL entrypoint used by the git pre-commit hook and the agent boundary:
#   .specify/gates/verify.sh --boundary ci
# Parity property: local green == CI green. The heavy lifting is the policy's
# verify-quality custom_command (make build && make test && make lint), so CI installs
# exactly the two tools that command needs: Go (from go.mod) and golangci-lint (pinned).
#
# Deliberate deviation from the upstream template, recorded as `ci:canary` in
# .specify/gates/.upgrade-holds:
#   the canary suite refuses to pass while the agent boundary (.claude/hooks/gates/*)
#   is not projected — this project's harness is CodeBuddy, so those canaries can only
#   skip. Re-enable the canary step here once agent hooks are projected for this harness.
#
# Hardened by default: read-only token, no persisted git credentials, one run per ref,
# a job timeout. Pin actions to commit SHAs if the organization requires it.
name: Quality Gates
on:
  pull_request:
    # `edited`: a title/description change re-runs the PR check.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the PR check walks base..head for protected changes.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Install gate tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq
          # golangci-lint must match the version developers run locally, or the lint
          # half of the parity property silently drifts. Build it from source instead
          # of downloading the release binary: the v1.64.8 release is built with
          # go1.24 and refuses to lint a module targeting go1.26
          # ("can't load config: the Go language version (go1.24) used to build
          # golangci-lint is lower than the targeted Go version (1.26.0)").
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run quality gates
        run: bash .specify/gates/verify.sh --boundary ci
      # 2026-10-24：policy 的 verify-quality 在 git 边界切到了 fast 档（`make verify-fast`
      # = lint + check + 单测），full 档由 pre-push 兜底。CI 没有 pre-push，必须自己补回
      # `make build`（其中含 docs-check 的 OpenAPI 漂移比对），否则文档腐化将没有任何边界拦得住。
      - name: Enforce the full delivery gate
        run: make build
      # PR title/description against the commit-message rules, Protected-Change
      # declarations across the PR's commits, and the pre-commit secret and
      # forbidden-file scan over each of them (commits made by cherry-pick, rebase,
      # am or revert never ran it). Passed via env, never interpolated into the
      # script (injection-safe). The check runs the BASE branch's pr-check.sh and lib
      # against the PR checkout (GATES_RUNTIME_DIR), so a PR cannot replace the code
      # that judges it.
      - name: Check the pull request (text, protected changes, secrets)
        if: github.event_name == 'pull_request'
        env:
          GATES_PR_TITLE: ${{ github.event.pull_request.title }}
          GATES_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base="origin/$GITHUB_BASE_REF"
          if git cat-file -e "$base:.specify/gates/pr-check.sh" 2>/dev/null; then
            rt="$(mktemp -d)"
            git archive "$base" .specify/gates | tar -x -C "$rt"
            echo "pr-check: running the base revision's pr-check.sh ($base)"
            GATES_RUNTIME_DIR="$rt/.specify/gates" bash "$rt/.specify/gates/pr-check.sh"
          else
            echo "pr-check: the base ($base) has no pr-check.sh (adoption PR); running the pull request's own copy"
            bash .specify/gates/pr-check.sh
          fi
