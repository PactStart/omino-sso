# api.<主域> 与 sso.<主域> 的边缘配置（contracts/nginx-routing.md §3 / §4）
#
# 为什么放在一个文件：两个块都只做「按路径反代到 sso 容器」，且都不含随环境变化的
# 前端变量，放一处便于核对暴露面。运维若偏好拆分，可原样拆成 api.conf / sso.conf，
# 行为不变。
#
# 与 portal.conf / admin.conf 不同，本文件**不进前端镜像**，由入口 nginx / 宿主机
# nginx 使用：它没有 `${API_UPSTREAM}`，也不需要 envsubst 渲染。
#
# 部署前必须替换（本文件不参与 envsubst 渲染，改完记得 `nginx -t` 再 reload）：
#   1. `server_name _;`（两处）→ 共享宿主机 nginx 时必须换成 `api.<主域>` / `sso.<主域>`；
#      独占一台入口 nginx 时保留 `_` 也可用，但同一端口上只能有一个 `_` 默认 server。
#   2. `ssl_certificate` / `ssl_certificate_key` → 实际证书路径（默认挂在 /etc/nginx/tls/）。
#   3. `proxy_pass http://sso:8081` / `http://sso:8080` → 入口 nginx 不在 compose 网络时
#      换成可达地址（同机为 `127.0.0.1:8081`、跨机用内网 IP 或内网 LB）。
#
# 暴露面（FR-015）
#   api 域：只放行 /api/v1/，且该域名只在 VPC 内 DNS 解析、明文、不配证书；
#   sso 域：只放行 OIDC 端点与 = /healthz，/readyz 与 /api/v1、/docs 一律 404。

# ---------------------------------------------------------------------------
# api.<主域> —— 仅内网，明文，唯一命名入口
# ---------------------------------------------------------------------------
server {
    # 内网明文；不要在这里加 ssl_certificate（契约明确"不配证书"）
    listen      80;
    # 独占该端口的入口 nginx 可保留 `_`；与其它站点共用时必须换成 api.<主域>
    server_name _;

    server_tokens off;
    # 管理 API 的 JSON 可能较大（如应用信息确认），与前端保持一致
    client_max_body_size 10m;

    # 边界：sso 容器同时监听 8080/8081，容器网络内任何服务都能直连 :8081；
    # 本域只是「谁被允许作为入口」的命名约定，真实隔离靠内网 DNS + 安全组。

    location /api/v1/ {
        # proxy_pass 不带 URI：/api/v1/... 原样转发，不做前缀替换
        proxy_pass http://sso:8081;
        proxy_http_version    1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 追加：保留前端 nginx / LB 写入的原始客户端 IP（多跳链路）
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # /docs 由后端按 APP_ENV 自行 404，这里无需规则；其余路径不对外
    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# sso.<主域> —— 公网 OIDC 端点；TLS 在此终止（或由上游 LB 终止）
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    http2       on;
    # 同上：与 portal/admin 的代理站点共用 443 时必须换成 sso.<主域>
    server_name _;

    # 通配符证书即可覆盖四个子域；证书未挂载时 nginx 启动即失败（符合预期）
    ssl_certificate     /etc/nginx/tls/sso.crt;
    ssl_certificate_key /etc/nginx/tls/sso.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10m;

    # 公网唯一放行的探针。注意：只放行 /healthz，**不配** /readyz（FR-015：公网必须 404）
    location = /healthz {
        access_log off;
        proxy_pass http://sso:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 协议端点：/oauth2/*、/.well-known/* 与三个整页端点（登录、登出、已登出）
    # 用一条正则收敛，避免 5 段重复的透传头配置；不带 URI 的 proxy_pass 允许出现在正则 location 中。
    location ~ ^/(oauth2/|\.well-known/|login$|logout$|logged-out$) {
        proxy_pass http://sso:8080;
        proxy_http_version    1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 必须显式设置：缺失时 OIDC issuer 校验与回跳协议会错
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # 其余（含 /readyz、/api/v1、/docs）公网不可见：sso 域不承接管理 API
    location / {
        return 404;
    }
}
