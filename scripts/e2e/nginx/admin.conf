# e2e 模拟：admin.lvh.me（对应 test/prod 的 web/nginx/admin.conf）
server {
    listen 443 ssl;
    server_name admin.lvh.me;

    ssl_certificate     /etc/nginx/tls/lvh.me.crt;
    ssl_certificate_key /etc/nginx/tls/lvh.me.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /srv/admin;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://host.docker.internal:9081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
