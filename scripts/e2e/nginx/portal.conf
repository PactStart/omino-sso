# e2e 模拟：portal.lvh.me（对应 test/prod 的 web/nginx/portal.conf）
#
# 由 scripts/e2e/run.sh 挂载到容器 /etc/nginx/conf.d，因此这里的路径都是容器内路径：
#   /etc/nginx/tls/  ← 脚本生成的自签证书
#   /srv/portal      ← 宿主机 web/portal/dist
# 端口固定为容器 443 → 宿主 127.0.0.1:8443（脚本已校验占用，不做模板替换）。
server {
    listen 443 ssl;
    server_name portal.lvh.me;

    ssl_certificate     /etc/nginx/tls/lvh.me.crt;
    ssl_certificate_key /etc/nginx/tls/lvh.me.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /srv/portal;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 前端容器自身的存活探针（不落到后端）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 同源 XHR：/api/ → api 域。这一跳模拟「前端 nginx → api 入口」。
    location /api/ {
        proxy_pass http://host.docker.internal:9081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 逐跳追加：模拟 LB → 前端 nginx → api 的多跳 XFF 链
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
