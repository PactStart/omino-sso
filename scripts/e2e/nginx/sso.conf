# e2e 模拟：sso.lvh.me（协议层公网入口）
#
# 暴露面按 FR-015 收敛：只放行协议端点与 /healthz；
# /readyz 与其余路径（/api/v1、/docs）一律 404 —— 这条是该脚本的核心断言之一。
server {
    listen 443 ssl;
    server_name sso.lvh.me;

    ssl_certificate     /etc/nginx/tls/lvh.me.crt;
    ssl_certificate_key /etc/nginx/tls/lvh.me.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 公网唯一放行的探针：真打后端存活探针（外部 LB 据此判进程存活）
    location = /healthz {
        access_log off;
        proxy_pass http://host.docker.internal:9080/healthz;
        proxy_set_header Host $host;
    }

    location = /login {
        proxy_pass http://host.docker.internal:9080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /logout {
        proxy_pass http://host.docker.internal:9080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /logged-out {
        proxy_pass http://host.docker.internal:9080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /oauth2/ {
        proxy_pass http://host.docker.internal:9080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /.well-known/ {
        proxy_pass http://host.docker.internal:9080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 其余（含 /readyz、/api/v1、/docs）公网不可见
    location / {
        return 404;
    }
}
