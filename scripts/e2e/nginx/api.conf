# e2e 模拟：api.lvh.me
#
# 真实环境该域只在 VPC 内解析、公网不可达、且用 HTTP（不配证书）。
# 本地无法模拟网络隔离，故仍用 TLS，只用于验证「浏览器不直连、由前端 nginx 反代」这条链路。
server {
    listen 443 ssl;
    server_name api.lvh.me;

    ssl_certificate     /etc/nginx/tls/lvh.me.crt;
    ssl_certificate_key /etc/nginx/tls/lvh.me.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location / {
        proxy_pass http://host.docker.internal:9081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
